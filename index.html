<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RK-100S Programs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <aside class="side">
    <div class="brand">
      <div class="logo">
        <div class="logo-text"><span class="korg">KORG</span><span class="model">RK-100S</span></div>
        <span id="conn-status" class="status off">Not connected</span>
      </div>
      <div class="side-buttons">
        <button id="btn-reload" class="icon" disabled title="Load programs: receive all programs and favorites from the keytar" aria-label="Load programs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button id="btn-global" class="icon" title="Global settings: MIDI channels, transpose, user scale" aria-label="Global settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.5 4 5.6 4 9s-1.4 6.5-4 9M12 3c-2.6 2.5-4 5.6-4 9s1.4 6.5 4 9"/></svg>
        </button>
      </div>
    </div>

    <div class="caption">FAVORITES</div>
    <table id="fav-table"></table>

    <div class="caption">PROGRAMS</div>
    <div class="list" id="list" tabindex="0"></div>
    <div class="status-line"><span id="status-text"></span></div>
  </aside>

  <main class="details" id="details">
    <div class="empty">Click a program to see its details.</div>
  </main>

  <script src="rk-sysex.js?v=1"></script>
  <script src="rk-link.js?v=1"></script>
  <script src="rk-edits.js?v=1"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
