# Deploys the page to GitHub Pages, only when a page file (or this workflow) changes.
# README and screenshot changes don't redeploy. Run it by hand from the Actions tab if needed.
name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ['**.html', '**.js', '**.css', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the page itself is published (no README, screenshots or .gitignore).
      - run: mkdir _site && cp index.html app.js style.css rk-sysex.js rk-link.js rk-edits.js _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
